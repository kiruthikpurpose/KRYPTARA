t id="g_fb7185" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb7185" stop-opacity="0.30"/><stop offset="1" stop-color="#fb7185" stop-opacity="0.08"/></linearGradient><marker id="arr_fb7185" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker><linearGradient id="g_60a5fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa" stop-opacity="0.30"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0.08"/></linearGradient><marker id="arr_60a5fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker><linearGradient id="g_94a3b8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#94a3b8" stop-opacity="0.30"/><stop offset="1" stop-color="#94a3b8" stop-opacity="0.08"/></linearGradient><marker id="arr_94a3b8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1200" height="440" rx="20" fill="url(#bg)"/><defs><pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17.0" cy="17.0" r="1.1" fill="#ffffff" opacity="0.06"/></pattern></defs><rect width="1200" height="440" rx="20" fill="url(#dots)"/><text x="60" y="52" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#e6edf7" text-anchor="start" opacity="1">Tiers: who may authorise what</text><text x="60" y="78" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9aa7c2" text-anchor="start" opacity="1">Each tier is a monotone table; each safety and liveness claim is a lint-checked interval.</text><rect x="60" y="109" width="1080" height="62" rx="14" fill="url(#g_fb7185)" stroke="#fb7185" stroke-width="1.6" filter="url(#shadow)"/><text x="84" y="137" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#e6edf7" text-anchor="start" opacity="1">T0 · HALT</text><text x="84" y="159" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9aa7c2" text-anchor="start" opacity="1">stops staged effects</text><text x="1116" y="143" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fb7185" text-anchor="end" opacity="1">any single key or presence</text><rect x="96" y="184" width="1008" height="62" rx="14" fill="url(#g_22d3ee)" stroke="#22d3ee" stroke-width="1.6" filter="url(#shadow)"/><text x="120" y="212" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#e6edf7" text-anchor="start" opacity="1">T1 · OPERATE</text><text x="120" y="234" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9aa7c2" text-anchor="start" opacity="1">day-to-day change</text><text x="1080" y="218" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#22d3ee" text-anchor="end" opacity="1">1-safe · live after 1 loss</text><rect x="132" y="259" width="936" height="62" rx="14" fill="url(#g_a78bfa)" stroke="#a78bfa" stroke-width="1.6" filter="url(#shadow)"/><text x="156" y="287" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#e6edf7" text-anchor="start" opacity="1">T2 · CONST</text><text x="156" y="309" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9aa7c2" text-anchor="start" opacity="1">changes to the key set and tables</text><text x="1044" y="293" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="end" opacity="1">2-safe</text><rect x="168" y="334" width="864" height="62" rx="14" fill="url(#g_34d399)" stroke="#34d399" stroke-width="1.6" filter="url(#shadow)"/><text x="192" y="362" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#e6edf7" text-anchor="start" opacity="1">T2 · RECOVERY</text><text x="192" y="384" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9aa7c2" text-anchor="start" opacity="1">except both hash families</text><text x="1008" y="368" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="end" opacity="1">1-safe · live after any 2 losses</text><text x="600" y="424" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="1">Re-keying lives in exactly one T2 tier per profile (REQ-TIER-02, machine-checked).</text></svg>
