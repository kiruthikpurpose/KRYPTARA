<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="The interval theorem"><title>The interval theorem</title><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/></filter><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151b33"/></linearGradient><linearGradient id="g_22d3ee" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0.08"/></linearGradient><marker id="arr_22d3ee" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker><linearGradient id="g_a78bfa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.30"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0.08"/></linearGradient><marker id="arr_a78bfa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><linearGradient id="g_34d399" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity="0.30"/><stop offset="1" stop-color="#34d399" stop-opacity="0.08"/></linearGradient><marker id="arr_34d399" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><linearGradient id="g_fbbf24" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.30"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0.08"/></linearGradient><marker id="arr_fbbf24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><linearGradient id="g_fb7185" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb7185" stop-opacity="0.30"/><stop offset="1" stop-color="#fb7185" stop-opacity="0.08"/></linearGradient><marker id="arr_fb7185" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker><linearGradient id="g_60a5fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa" stop-opacity="0.30"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0.08"/></linearGradient><marker id="arr_60a5fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker><linearGradient id="g_94a3b8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#94a3b8" stop-opacity="0.30"/><stop offset="1" stop-color="#94a3b8" stop-opacity="0.08"/></linearGradient><marker id="arr_94a3b8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1200" height="400" rx="20" fill="url(#bg)"/><defs><pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17.0" cy="17.0" r="1.1" fill="#ffffff" opacity="0.06"/></pattern></defs><rect width="1200" height="400" rx="20" fill="url(#dots)"/><text x="60" y="52" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#e6edf7" text-anchor="start" opacity="1">Interval theorem</text><text x="60" y="78" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9aa7c2" text-anchor="start" opacity="1">Given a fault structure, the safe-and-live policies are exactly the monotone tables between Lo and U.</text><rect x="60" y="190" width="1080" height="46" rx="23" fill="#94a3b8" opacity="0.15"/><rect x="300" y="190" width="640" height="46" rx="23" fill="url(#g_34d399)" stroke="#34d399" stroke-width="2"/><text x="620" y="219" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#e6edf7" text-anchor="middle" opacity="1">safe  and  live:   Lo  ≤  f  ≤  U</text><path d="M60,168 L300,168" stroke="#fb7185" stroke-width="2" marker-end="url(#arr_fb7185)"/><text x="180" y="158" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fb7185" text-anchor="middle" opacity="1">too weak: loses liveness</text><path d="M1140,168 L940,168" stroke="#fb7185" stroke-width="2" marker-end="url(#arr_fb7185)"/><text x="1040" y="158" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fb7185" text-anchor="middle" opacity="1">too strong: one fault authorises</text><circle cx="300" cy="213" r="9" fill="#fbbf24" stroke="#0b1020" stroke-width="3"/><text x="300" y="264" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="17" font-weight="800" fill="#fbbf24" text-anchor="middle" opacity="1">Lo</text><circle cx="940" cy="213" r="9" fill="#fbbf24" stroke="#0b1020" stroke-width="3"/><text x="940" y="264" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="17" font-weight="800" fill="#fbbf24" text-anchor="middle" opacity="1">U</text><rect x="60" y="290" width="330" height="70" rx="14" fill="url(#g_22d3ee)" stroke="#22d3ee" stroke-width="1.6" filter="url(#shadow)"/><text x="225.0" y="317.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf7" text-anchor="middle" opacity="1">Class-count law</text><text x="225.0" y="337.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa7c2" text-anchor="middle" opacity="1">k ≥ t + s + 1</text><rect x="435" y="290" width="330" height="70" rx="14" fill="url(#g_a78bfa)" stroke="#a78bfa" stroke-width="1.6" filter="url(#shadow)"/><text x="600.0" y="317.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf7" text-anchor="middle" opacity="1">Admission (REQ-ADM-01)</text><text x="600.0" y="337.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9aa7c2" text-anchor="middle" opacity="1">table in [Lo, U] and tightening</text><rect x="810" y="290" width="330" height="70" rx="14" fill="url(#g_fbbf24)" stroke="#fbbf24" stroke-width="1.6" filter="url(#shadow)"/><text x="975.0" y="317.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf7" text-anchor="middle" opacity="1">Recovery is an attack path</text><text x="975.0" y="337.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9aa7c2" text-anchor="middle" opacity="1">every recovery route is priced</text></svg>
